<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahorcado a dos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{
  /* fondo oscuro azul pizarra (no cansa la vista) con acentos pastel: menta, melocotón, celeste y mantequilla */
  --bg:#1c2130; --board:#272d3f; --chalk:#e6eaf2; --dim:#a3abbe; --yellow:#a8e6cf; --red:#ff9aa2; --line:#3c4459; --key:#343b50; --ink:#1c2130;
  --peach:#ffcfb0; --sky:#a7c7e7; --butter:#f3e3a0;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#2a3148 0%,var(--bg) 60%) fixed,var(--bg);color:var(--chalk);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:600;color:var(--peach);font-size:clamp(1.8rem,8vw,2.6rem);margin:0;text-align:center}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-variant-numeric:tabular-nums}
.p{min-width:0;background:var(--board);border-radius:16px;padding:8px 12px;border:2px solid transparent;display:flex;align-items:center;justify-content:space-between;gap:8px}
.p.on{border-color:var(--yellow)}
.p div{min-width:0}
.p b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p small{display:block;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.p span{font-family:var(--display);font-weight:600;font-size:1.8rem;line-height:1;white-space:nowrap}
.p span::after{content:" ♥";font-size:1rem;color:var(--peach)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:4px;vertical-align:middle}
.dot.live{background:#9ad7b0}
.card{background:var(--board);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:500;font-size:1.6rem;margin:0;text-wrap:balance}
label{font-weight:700;font-size:.9rem;color:var(--dim);display:flex;flex-direction:column;gap:6px}
input{font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--chalk);width:100%}
input:focus{outline:none;border-color:var(--yellow)}
input[readonly]{font-size:14px;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;min-height:48px;background:var(--yellow);color:var(--ink);touch-action:manipulation;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.ghost{background:transparent;color:var(--dim);border:2px solid var(--line)}
.err{color:var(--red);font-weight:700;margin:0}
.err:empty{display:none}
.extra summary{color:var(--dim);font-weight:700;font-size:.9rem;cursor:pointer;padding:6px 0;list-style:none}
.extra summary::-webkit-details-marker{display:none}
.extra[open] summary{margin-bottom:6px}
#fig{width:100%;max-width:min(200px,42vw);margin:0 auto;display:block}
#fig *{stroke:var(--chalk);stroke-width:5;stroke-linecap:round;fill:none}
/* cada trazo se dibuja como a lápiz, uno tras otro */
.part{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease-out}
.part.show{stroke-dashoffset:0}
/* muerte: cuando termina el último trazo, ojos en X, se pone rojo, da el tirón y se queda colgando */
#face{opacity:0;transition:opacity .4s}
#face path{stroke-width:3}
#man{transform-box:view-box;transform-origin:130px 15px}
#man *{transition:stroke .4s}
svg.dead #face{opacity:1;transition-delay:var(--d,0s)}
svg.dead #man *{stroke:var(--red);transition-delay:var(--d,0s)}
svg.dead #man{animation:drop .35s ease-in var(--d,0s) both,swing 2.2s ease-in-out calc(var(--d,0s) + .35s) infinite}
@keyframes drop{0%{transform:translateY(0)}60%{transform:translateY(7px)}100%{transform:translateY(4px)}}
@keyframes swing{0%,100%{transform:translateY(4px) rotate(-5deg)}50%{transform:translateY(4px) rotate(5deg)}}
select{font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--chalk);width:100%}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 5px;font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,7.5vw,2.2rem)}
.word i{font-style:normal;width:1.05em;text-align:center;border-bottom:3px solid var(--chalk);line-height:1.2}
.word i.sp{border:0;width:.5em}
.word i.miss{color:var(--red)}
.hint,.lives,.center{text-align:center;color:var(--dim);margin:0}
.hint strong{color:var(--butter)}
.lives{font-variant-numeric:tabular-nums;font-size:.9rem}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.keys button{padding:0;min-height:46px;font-size:1.1rem;background:var(--key);color:var(--chalk);border-radius:12px}
.keys button.ok{background:var(--sky);color:var(--ink)}
.keys button.no{background:transparent;color:var(--dim);border:2px solid var(--line);text-decoration:line-through}
.keys button:disabled{cursor:default}
.keys.wait button:not(.ok):not(.no){opacity:.4}
.big{font-family:var(--display);font-weight:500;font-size:1.5rem;text-align:center;margin:0;text-wrap:balance}
.big:empty{display:none}
.wait-msg{font-family:var(--display);font-weight:500;font-size:1.3rem;text-align:center;margin:0;color:var(--butter);text-wrap:balance}
.status{text-align:center;color:var(--dim);font-size:.9rem;margin:0}
.status:empty{display:none}
@media (min-width:600px){.keys{grid-template-columns:repeat(9,1fr)}.card{padding:20px}}
/* lo que ve quien espera: letra en grande, fichas que saltan, corazones que se rompen, confeti */
#vPlay{position:relative}
.toast{position:absolute;left:50%;top:30%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3;animation:toast 1.7s ease forwards}
.toast b{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:2.8rem;background:var(--sky);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.no b{background:var(--red)}
.toast span{font-weight:800;background:var(--board);padding:4px 12px;border-radius:999px;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
.word i.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.2) translateY(12px);color:var(--sky)}60%{transform:scale(1.4);color:var(--sky)}100%{transform:scale(1)}}
.keys button.just{animation:pop .6s ease}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.hearts{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;font-size:1.25rem;line-height:1}
.hearts i{font-style:normal;color:var(--peach);transition:color .3s,transform .3s}
.hearts i.lost{color:var(--line);transform:scale(.8)}
.hearts i.break{animation:brk .7s ease}
@keyframes brk{0%{transform:scale(1.5) rotate(-15deg);color:var(--red)}50%{transform:scale(1.2) rotate(10deg);color:var(--red)}100%{transform:scale(.8)}}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* poderes de quien mira: sacudir (cada 3 min) y desordenar el teclado (cada 5 min) */
#powers button{background:var(--key);color:var(--dim);font-size:.95rem;padding:10px 8px}
#powers button:not(:disabled){background:var(--butter);color:var(--ink);animation:pop .6s ease}
#powers button:disabled{cursor:default}
body.quake .wrap{animation:quake .22s linear infinite}
@keyframes quake{0%{transform:translate(0,0)}25%{transform:translate(-10px,6px) rotate(-1.5deg)}50%{transform:translate(9px,-7px) rotate(1.2deg)}75%{transform:translate(-7px,-5px) rotate(-.8deg)}100%{transform:translate(0,0)}}
.counter{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.counter span{background:var(--key);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.counter b{color:var(--sky)}
.counter .bad b{color:var(--red)}
/* ---- muñeco de nieve: amanece con cada fallo, se derrite y pierde sus cosas; al final el sol lo quema ---- */
#snow{width:100%;max-width:min(270px,72vw);display:block;margin:0 auto;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
#snow .sky-d,#snow .sky-h,#snow .stars,#snow .glow,#snow .rays,#snow .slush,#snow .wet,#snow .sweat,#snow .tear{transition:opacity 1.3s ease}
#snow .sky-d,#snow .sky-h,#snow .rays,#snow .glow,#snow .wet,#snow .sweat,#snow .tear{opacity:0}
#snow .slush{fill:#8ea5b7;opacity:0}
#snow .sun,#snow .moon{transition:transform 1.6s cubic-bezier(.3,.7,.3,1)}
#snow .sun{transform:translateY(170px)}
#snow .core,#snow .puddle,#snow .ball,#snow .acc,#snow .smoke circle{transform-box:fill-box}
#snow .core,#snow .puddle{transform-origin:50% 50%;transition:transform 1.4s cubic-bezier(.3,.7,.3,1)}
#snow .puddle{transform:scale(0)}
#snow .ball{transform-origin:50% 0;transition:transform 1.4s cubic-bezier(.3,.7,.3,1),opacity 1.4s}
#snow .rays{stroke:#ffe27a;stroke-width:2.5;stroke-linecap:round;fill:none;transform-box:fill-box;transform-origin:50% 50%;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#snow .man{transform-box:view-box;transform-origin:125px 16px;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
#snow .m,#snow .brow{display:none}
#snow[data-mood="0"] .m0,#snow[data-mood="1"] .m1,#snow[data-mood="2"] .m2,#snow[data-mood="3"] .m3,#snow[data-mood="2"] .brow,#snow[data-mood="3"] .brow{display:inline}
#snow .acc{transform-origin:50% 50%;transition:transform .9s cubic-bezier(.55,0,.85,.45)}
#snow .acc.fell{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}
#snow .drip{opacity:0}
#snow .drip.on{animation:drip 1.7s ease-in infinite}
@keyframes drip{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(13px)}}
#snow .smoke circle{opacity:0;transform-origin:50% 50%}
#snow.dead .smoke circle{animation:smoke 2.6s ease-out infinite;animation-delay:calc(var(--d,0s) + var(--k,0s))}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.75}100%{opacity:0;transform:translateY(-75px) scale(1.9)}}
#snow.dead .ball{opacity:.6;transition:transform 1.8s ease-in var(--d,0s),opacity 1.8s ease var(--d,0s)}
#snow.dead .core{animation:burn 1.1s ease-in-out var(--d,0s) infinite}
@keyframes burn{0%,100%{transform:scale(1.6)}50%{transform:scale(1.85)}}
#snow.dead .rays{animation-duration:2.4s}
#snow .rip{opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
#snow.dead .rip{opacity:1;transform:none;transition-delay:calc(var(--d,0s) + 1s)}
/* selector de muñequito */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{flex-direction:column;gap:4px;background:var(--key);color:var(--chalk);border:2px solid transparent;padding:10px 8px;font-weight:700}
.skin svg{width:46px;height:46px;display:block}
.skin.sel{border-color:var(--yellow);background:#2e3a4b}
@media (prefers-reduced-motion:reduce){#snow .man,#snow .rays,#snow .drip.on,#snow.dead .smoke circle,#snow.dead .core{animation:none}}
/* reacciones: emojis y frases que suben por la pantalla un momento */
.react{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(28,33,48,.96);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.emos{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:560px;margin:0 auto;width:100%}
.emos::-webkit-scrollbar{display:none}
.emos button{background:transparent;font-size:1.55rem;min-height:42px;padding:0 6px;flex:0 0 auto;border-radius:10px}
.say{display:flex;gap:6px;max-width:560px;margin:0 auto;width:100%}
.say input{padding:9px 12px;font-size:16px;min-width:0}
.say button{min-height:44px;padding:0 16px;background:var(--peach)}
body.has-react{padding-bottom:150px}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.floater{position:absolute;bottom:140px;max-width:72vw;background:var(--board);color:var(--chalk);padding:8px 14px;border-radius:18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);overflow-wrap:anywhere;animation:floatUp 3.2s ease-out forwards}
.floater small{color:var(--peach);font-weight:800;font-size:.85rem}
.floater.emo{background:none;box-shadow:none;font-size:3.4rem;padding:0;line-height:1}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,20px) scale(.4)}12%{opacity:1;transform:translate(-50%,0) scale(1.2)}22%{transform:translate(-50%,-10px) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-48vh)}}
@media (prefers-reduced-motion:reduce){.part{transition:none}svg.dead #man{animation:none}.toast,.word i.pop,.keys button.just,.shake,.hearts i.break,.dots i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ahorcado a dos</h1>
  <div class="score" id="score" hidden>
    <div class="p" id="p0"><div><small id="t0"></small><b id="n0"></b></div><span id="s0">0</span></div>
    <div class="p" id="p1"><div><small id="t1"></small><b id="n1"></b></div><span id="s1">0</span></div>
    <div class="p" id="p2" hidden><div><small id="t2"></small><b id="n2"></b></div><span id="s2">0</span></div>
  </div>
  <button type="button" class="ghost" id="invite3" hidden>＋ Invitar a una tercera persona (opcional)</button>
  <p class="status" id="status"></p>

  <form class="card" id="vName" hidden>
    <h2 id="nameTitle">Crear partida</h2>
    <label for="inName">Tu nombre<input id="inName" maxlength="16" autocomplete="off" placeholder="Ej.: Ana"></label>
    <p class="err" id="nameErr"></p>
    <button type="submit" id="nameBtn">Crear partida</button>
  </form>

  <div class="card" id="vInvite" hidden>
    <h2>Mándale este enlace</h2>
    <input id="link" readonly aria-label="Enlace de la partida">
    <div class="row">
      <button type="button" id="copy">Copiar enlace</button>
      <a class="btn ghost" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    </div>
    <p class="wait-msg">Esperando a que entre…</p>
  </div>

  <div class="card" id="vChoose" hidden>
    <p class="center">Elige el muñequito</p>
    <div class="skins" id="skinsA"></div>
    <h2>¿Quién empieza?</h2>
    <div class="row" id="pickA"></div>
  </div>

  <form class="card" id="vSecret" hidden>
    <h2 id="secretTitle"></h2>
    <label for="inWord">Tu palabra o frase (espacios, guiones y signos se verán tal cual)<input id="inWord" type="password" maxlength="40" autocomplete="off"></label>
    <label for="inMax">Intentos antes de ahorcarse
      <select id="inMax"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
    </label>
    <details class="extra"><summary>+ Añadir una pista (si quieres)</summary>
      <input id="inHint" maxlength="50" autocomplete="off" placeholder="Ej.: un animal" aria-label="Pista">
    </details>
    <p class="err" id="secretErr"></p>
    <button type="submit">Listo, ¡a adivinar!</button>
  </form>

  <div class="card" id="vWait" hidden><p class="wait-msg" id="waitMsg"></p></div>

  <div class="card" id="vPlay" hidden>
    <svg viewBox="0 0 200 200" aria-label="Dibujo del ahorcado" id="fig">
      <path class="part" pathLength="1" d="M20 190H120"/>
      <path class="part" pathLength="1" d="M50 190V15"/>
      <path class="part" pathLength="1" d="M50 15H130"/>
      <path class="part" pathLength="1" d="M130 15V35"/>
      <g id="man">
        <circle class="part" pathLength="1" cx="130" cy="50" r="15"/>
        <path class="part" pathLength="1" d="M130 65V120"/>
        <path class="part" pathLength="1" d="M130 80L108 102"/>
        <path class="part" pathLength="1" d="M130 80L152 102"/>
        <path class="part" pathLength="1" d="M130 120L110 155"/>
        <path class="part" pathLength="1" d="M130 120L150 155"/>
        <g id="face"><path d="M122 44l6 6M128 44l-6 6M132 44l6 6M138 44l-6 6M124 59q6-5 12 0"/></g>
      </g>
    </svg>
    <svg viewBox="0 0 200 220" id="snow" hidden data-mood="0" aria-label="Muñeco de nieve colgado que se derrite con cada fallo">
      <defs>
        <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a33"/><stop offset="1" stop-color="#3a3462"/></linearGradient>
        <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d72b8"/><stop offset=".6" stop-color="#f3a48e"/><stop offset="1" stop-color="#ffd9a3"/></linearGradient>
        <linearGradient id="skyH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb648"/><stop offset=".65" stop-color="#ff7a45"/><stop offset="1" stop-color="#ff5233"/></linearGradient>
        <radialGradient id="sunG"><stop offset="0" stop-color="#fffbe8"/><stop offset=".55" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb23c"/></radialGradient>
        <radialGradient id="glowG"><stop offset="0" stop-color="#fff2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffb23c" stop-opacity="0"/></radialGradient>
        <radialGradient id="ballG" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef4fa"/><stop offset="1" stop-color="#cddbe8"/></radialGradient>
        <mask id="moonM"><circle cx="42" cy="36" r="11" fill="#fff"/><circle cx="47" cy="32" r="10" fill="#000"/></mask>
      </defs>
      <rect width="200" height="220" fill="url(#skyN)"/>
      <rect class="sky-d" width="200" height="220" fill="url(#skyD)"/>
      <rect class="sky-h" width="200" height="220" fill="url(#skyH)"/>
      <g class="stars" fill="#fff"><circle cx="18" cy="22" r="1"/><circle cx="70" cy="14" r=".8"/><circle cx="96" cy="40" r="1.1"/><circle cx="150" cy="20" r=".9"/><circle cx="182" cy="44" r="1"/><circle cx="12" cy="70" r=".8"/><circle cx="176" cy="88" r=".8"/><circle cx="66" cy="62" r=".7"/></g>
      <g class="moon"><circle cx="42" cy="36" r="11" fill="#f6f1cf" mask="url(#moonM)"/></g>
      <g class="sun">
        <circle class="glow" cx="160" cy="48" r="44" fill="url(#glowG)"/>
        <path class="rays" d=""/>
        <circle class="core" cx="160" cy="48" r="15" fill="url(#sunG)"/>
      </g>
      <rect y="197" width="200" height="23" fill="#e6eff7"/>
      <path d="M0 199q20-6 40 0t40 0t40 0t40 0t40 0V220H0z" fill="#f4f8fc"/>
      <rect class="wet" y="197" width="200" height="23" fill="#7c9c8b"/>
      <ellipse class="puddle" cx="125" cy="203" rx="38" ry="5" fill="#9ccfee"/>
      <g class="wood" fill="none" stroke="#7a5843" stroke-linecap="round"><path d="M30 199V16H131" stroke-width="6"/><path d="M30 46L60 16" stroke-width="4"/><path d="M14 199H48" stroke-width="6"/></g>
      <path d="M125 16V89" stroke="#c9a46c" stroke-width="2.5" fill="none"/>
      <g class="man">

      <g class="rip"><path d="M170 199v-13" stroke="#6b4b35" stroke-width="2.5"/><rect x="155" y="175" width="30" height="12" rx="2" fill="#a07850"/><text x="170" y="183.6" font-size="6.5" text-anchor="middle" fill="#fff" font-family="Fredoka,sans-serif">Q.E.P.D.</text></g>

  <div class="emos" id="emos"></div>
  <div class="say"><input id="inSay" maxlength="60" autocomplete="off" enterkeyhint="send" placeholder="Escribe algo o cualquier emoji…" aria-label="Mensaje"><button type="submit">Enviar</button></div>

<script>
/* La partida vive en ntfy.sh (mensajería gratuita por HTTPS, sin cuentas): cada jugada publica el estado entero
   con un número de versión, y todos se quedan con la versión más alta. Guarda los mensajes 12 h, así que la
   partida sigue aunque los dos cierren el juego; además cada móvil guarda su copia y la vuelve a subir si hace falta. */
const NTFY = "https://ntfy.sh/";
const PARTS = 10, LETTERS = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const $ = id => document.getElementById(id);
let sala = new URLSearchParams(location.search).get("sala");
if (sala && !/^ahorcado-[a-z0-9]{8,20}$/.test(sala)) sala = null;
// 2 o 3 jugadores: uno pone la palabra (setter) y los demás adivinan por turnos, una letra cada uno (guesser = turno actual)
const FRESH = () => ({ v: 0, names: ["", "", ""], pts: [0, 0, 0], setter: 0, guesser: 1, phase: "choose", word: "", hint: "", used: [], errors: 0, max: 6, skin: load("ahorcado-skin") === "nieve" ? "nieve" : "clasico" });
const players = s => [0, 1, 2].filter(i => s.names[i]);
const guessers = s => players(s).filter(i => i !== s.setter);
function nextG(s, from){ const g = guessers(s); if (!g.length) return from; const k = g.indexOf(from); return g[(k + 1) % g.length]; }
const nameOf = i => (S && S.names[i]) || "Jugador " + (i + 1);
const listNames = ids => ids.map(nameOf).join(" y ");
let S = null, mySeat = null, myName = "", es = null, loadedTimer = null;

const norm = c => { c = c.toUpperCase(); return c === "Ñ" ? c : c.normalize("NFD").replace(/[̀-ͯ]/g, ""); }; // la Ñ es letra propia
const isLetter = c => LETTERS.includes(norm(c));
// las letras se adivinan; espacios, números y signos (- , ¿ ? !) se ven desde el principio
const validWord = w => typeof w === "string" && w.length <= 40 && [...w].some(isLetter) && !/[\u0000-\u001f<>]/.test(w);
const shown = c => !isLetter(c);
const status = t => $("status").textContent = t;
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

/* ---------- reglas: cada uno solo puede hacer su jugada ---------- */
function apply(seat, a){
  if (!S) return;
  const s = structuredClone(S);
  if (a.t === "name"){ s.names[seat] = String(a.name).trim().slice(0, 16); }
  else if (a.t === "secret" && s.phase === "secret" && seat === s.setter && validWord(a.word)){
    const max = Math.min(10, Math.max(1, parseInt(a.max, 10) || 6));
    Object.assign(s, { phase: "play", word: a.word, hint: String(a.hint || "").slice(0, 50), used: [], errors: 0, max, lastBy: null, roundSkin: s.skin || "clasico" });
    if (s.guesser === s.setter || !s.names[s.guesser]) s.guesser = nextG(s, s.setter);
  }
  else if (a.t === "guess" && s.phase === "play" && seat === s.guesser && LETTERS.includes(a.l) && !s.used.includes(a.l)){
    s.used.push(a.l); s.lastBy = seat;
    if (![...s.word].some(c => norm(c) === a.l)) s.errors++;
    const won = [...s.word].every(c => shown(c) || s.used.includes(norm(c)));
    if (won || s.errors >= s.max){
      s.phase = "done";
      if (won) guessers(s).forEach(i => s.pts[i]++); else s.pts[s.setter]++; // adivinan: +1 cada uno; muere: +1 a quien la puso
    } else s.guesser = nextG(s, seat); // turno del siguiente que adivina (con 2 jugadores no cambia)
  }
  else if (a.t === "skin" && (s.phase === "done" || s.phase === "choose") && a.k in SKINS){ s.skin = a.k; }
  else if (a.t === "next" && (s.phase === "done" || s.phase === "choose") && players(s).includes(a.w)){
    Object.assign(s, { phase: "secret", setter: a.w, word: "", hint: "", used: [], errors: 0 });
    s.guesser = nextG(s, a.w);
  }
  else return;
  s.v = S.v + 1;
  S = s; store("ahorcado-estado-" + sala, S); render();
  send(S);
}
const act = a => apply(mySeat, a);

async function send(s, retry = true){
  try {
    const r = await fetch(NTFY + sala, { method: "POST", body: JSON.stringify(s) });
    if (!r.ok) throw r.status;
  } catch (e) {
    if (retry){ status("Reenviando la jugada…"); setTimeout(() => send(s, false), 3000); }
    else status(e === 429 ? "Vais muy rápido: espera unos segundos." : "No se pudo enviar la jugada. Revisa tu conexión.");
    return;
  }
  status("");
}

function valid(s){
  return s && typeof s === "object" && Number.isInteger(s.v) && Array.isArray(s.names) && s.names.length >= 2 && s.names.length <= 3 &&
    Array.isArray(s.pts) && Array.isArray(s.used) && [0, 1, 2].includes(s.guesser) &&
    ["choose", "secret", "play", "done"].includes(s.phase) && (s.phase === "secret" || s.phase === "choose" || validWord(s.word));
}
// partidas guardadas con la versión de 2 jugadores
function upgrade(s){
  while (s.names.length < 3) s.names.push("");
  while (s.pts.length < 3) s.pts.push(0);
  if (![0, 1, 2].includes(s.setter)) s.setter = 1 - s.guesser;
  return s;
}
function receive(s){
  if (!valid(s) || (S && s.v <= S.v)) return;
  S = upgrade(s); store("ahorcado-estado-" + sala, S); render();
}

/* ---------- conexión ---------- */
function connect(){
  status("Conectando…");
  es = new EventSource(NTFY + sala + "/sse?since=all"); // repite lo guardado y luego llega en directo; se reconecta solo
  es.onopen = () => status("");
  es.onerror = () => status("Reconectando…");
  // respaldo: si la conexión en directo se cae, consulta cada 8 s
  setInterval(async () => {
    if (es && es.readyState === 1) return;
    try {
      const t = await (await fetch(NTFY + sala + "/json?poll=1&since=all")).text();
      t.trim().split(/\r?\n/).forEach(l => { try { const m = JSON.parse(l); if (m.event === "message") receive(JSON.parse(m.message)); } catch {} });
    } catch {}
  }, 8000);
  es.onmessage = e => {
    try {
      const m = JSON.parse(e.data); if (m.event !== "message") return;
      const d = JSON.parse(m.message);
      // reacción: solo si es reciente (al conectar se repiten los mensajes guardados) y no es mía
      if (d && (d.p === "shake" || d.p === "shuffle")){
        if (!myReacts.has(d.id) && Date.now() / 1000 - m.time < 15 && S && S.phase === "play" && mySeat !== S.setter && [0, 1, 2].includes(d.from)) applyPower(d.p, d.from);
        return;
      }
      if (d && typeof d.r === "string"){
        if (!myReacts.has(d.id) && Date.now() / 1000 - m.time < 15 && [0, 1, 2].includes(d.from)) floatUp(d.r.slice(0, 60), d.from);
        return;
      }
      receive(d);
    } catch {}
  };
  // tras recibir lo guardado: si mi copia es más nueva (o el servidor ya la borró), la vuelvo a subir; y me apunto con mi nombre
  loadedTimer = setTimeout(() => {
    const local = load("ahorcado-estado-" + sala);
    if (valid(local) && (!S || local.v > S.v)){ S = upgrade(local); render(); send(S); }
    if (!S){ status(""); $("waitMsg").textContent = "Esta partida ya no existe. Pide un enlace nuevo."; show("vWait"); return; }
    if (mySeat === -1){ // recién llegado: mismo nombre que un hueco, o el primer hueco libre
      const seat = [1, 2].find(i => S.names[i] === myName) ?? [1, 2].find(i => !S.names[i]);
      if (seat === undefined){ $("waitMsg").textContent = "Esta partida ya tiene 3 jugadores."; show("vWait"); return; }
      mySeat = seat; store("ahorcado-puesto-" + sala, mySeat);
    }
    if (S.names[mySeat] !== myName) act({ t: "name", name: myName });
  }, 2500);
}

/* ---------- pantalla ---------- */
function show(v){ for (const id of ["vName","vInvite","vChoose","vSecret","vWait","vPlay"]) $(id).hidden = id !== v; }

function render(){
  if (mySeat === null){ $("score").hidden = true; return show("vName"); }
  if (mySeat === -1 && S){ $("score").hidden = true; $("waitMsg").textContent = "Entrando en la partida…"; return show("vWait"); }
  if (!S){ $("score").hidden = true; $("waitMsg").textContent = "Cargando la partida…"; return show("vWait"); }
  $("score").hidden = false;
  const n = players(S).length;
  const reacting = n >= 2 && !(S.phase === "secret" && mySeat === S.setter); // no tapa el formulario de la palabra
  $("react").hidden = !reacting; document.body.classList.toggle("has-react", reacting);
  $("score").style.gridTemplateColumns = `repeat(${S.names[2] ? 3 : 2},1fr)`;
  $("p2").hidden = !S.names[2];
  $("invite3").hidden = n !== 2;
  for (const i of [0, 1, 2]){
    $("n"+i).textContent = S.names[i] || "—";
    $("t"+i).innerHTML = "";
    const d = document.createElement("i"); d.className = "dot" + (S.names[i] ? " live" : "");
    $("t"+i).append(d, `Jugador ${i + 1}${i === mySeat ? " · tú" : ""}`);
    $("s"+i).textContent = S.pts[i];
    $("p"+i).classList.toggle("on", S.phase === "play" && i === S.guesser);
  }
  if (mySeat === 0 && n < 2){
    const url = location.origin + location.pathname + "?sala=" + sala;
    $("link").value = url;
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent("¿Jugamos al ahorcado? Entra aquí: " + url);
    return show("vInvite");
  }
  if (S.phase === "choose"){ skinPicker($("skinsA")); picks($("pickA")); return show("vChoose"); }
  if (S.phase === "secret"){
    if (mySeat === S.setter){
      $("secretTitle").textContent = `Te toca escribir la palabra para ${listNames(guessers(S))}`;
      return show("vSecret");
    }
    waitText(`${nameOf(S.setter)} está escribiendo la palabra secreta`);
    return show("vWait");
  }
  renderBoard(); show("vPlay");
}

let seen = { word: null, g: null, used: [], over: false };

/* ---------- reacciones (van aparte del estado de la partida) ---------- */
const EMOS = "😂 🤣 😘 😍 🥰 😜 🤪 😏 😱 😭 🙈 🫣 🤔 👀 🔥 💀 💔 ❤️ 💋 👏 🎉 🥳 😈 🤡 😴 🍀 🙏 👻".split(" ");
const myReacts = new Set();
let lastReact = 0;
function react(r){
  r = String(r).trim().slice(0, 60);
  if (!r || !sala || mySeat === null) return;
  const now = Date.now();
  if (now - lastReact < 1200) return; // sin spam: ntfy limita los envíos
  lastReact = now;
  const id = Math.random().toString(36).slice(2, 10);
  myReacts.add(id); floatUp(r, mySeat);
  fetch(NTFY + sala, { method: "POST", body: JSON.stringify({ r, from: mySeat, id }) }).catch(() => {});
}
function floatUp(r, from){
  const el = document.createElement("div");
  const emo = !/[\p{L}\p{N}]/u.test(r) && [...r].length <= 6;
  el.className = "floater" + (emo ? " emo" : "");
  el.style.left = (15 + Math.random() * 70) + "%";
  if (!emo){ const n = document.createElement("small"); n.textContent = (from === mySeat ? "Tú" : (S && S.names[from]) || "") + ": "; el.append(n); }
  el.append(r);
  $("floaters").append(el);
  setTimeout(() => el.remove(), 3300);
}
for (const e of EMOS){
  const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.setAttribute("aria-label", "Enviar " + e);
  b.onclick = () => react(e);
  $("emos").append(b);
}
/* ---------- poderes ---------- */
// cada poder se usa UNA vez por ronda, cuando quieras; al usar uno, el otro queda bloqueado 2 minutos
const LOCK = 2 * 60000, OTHER = { shake: "shuffle", shuffle: "shake" };
let pw = null, quakeUntil = 0, shuffleUntil = 0, keyOrder = LETTERS;
const roundId = () => `${S.pts.join(",")}|${S.setter}|${S.word}`;
function powersTick(){
  const spect = !!S && S.phase === "play" && mySeat === S.setter;
  $("powers").hidden = !spect;
  if (!spect) return;
  if (!pw) pw = load("ahorcado-poderes2-" + sala); // guardado para que recargar no devuelva los usos
  if (!pw || !pw.used || !pw.lock) pw = { round: null, used: {}, lock: { shake: 0, shuffle: 0 } };
  if (pw.round !== roundId()){ pw.round = roundId(); pw.used = {}; pw.lock = { shake: 0, shuffle: 0 }; store("ahorcado-poderes2-" + sala, pw); } // partida nueva: todo se vuelve a habilitar
  const now = Date.now();
  setPw($("pwShake"), "🌪️ Sacudir", "shake", now);
  setPw($("pwShuffle"), "🔀 Desordenar", "shuffle", now);
}
function setPw(b, label, p, now){
  const left = pw.lock[p] - now;
  b.disabled = !!pw.used[p] || left > 0;
  const s = Math.ceil(left / 1000);
  b.textContent = pw.used[p] ? `${label} ✓ usado` : left > 0 ? `${label} en ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : label;
}
setInterval(powersTick, 1000);
function usePower(p){
  const now = Date.now();
  if (!pw || pw.used[p] || pw.lock[p] > now || !S || S.phase !== "play" || mySeat !== S.setter) return;
  pw.used[p] = true; pw.lock[OTHER[p]] = now + LOCK; store("ahorcado-poderes2-" + sala, pw);
  const id = Math.random().toString(36).slice(2, 10);
  myReacts.add(id);
  fetch(NTFY + sala, { method: "POST", body: JSON.stringify({ p, from: mySeat, id }) }).catch(() => {});
  floatUp(p === "shake" ? "🌪️ ¡Sacudida enviada!" : "🔀 ¡Le desordenaste las letras!", mySeat);
  powersTick();
}
$("pwShake").onclick = () => usePower("shake");
$("pwShuffle").onclick = () => usePower("shuffle");
function applyPower(p, from){
  if (p === "shake"){
    quakeUntil = Date.now() + 5000;
    document.body.classList.remove("quake"); void document.body.offsetWidth; document.body.classList.add("quake");
    setTimeout(() => { if (Date.now() >= quakeUntil) document.body.classList.remove("quake"); }, 5050);
    floatUp("🌪️ ¡Te están sacudiendo la pantalla!", from);
  } else {
    shuffleUntil = Date.now() + 30000;
    keyOrder = [...LETTERS];
    for (let i = keyOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [keyOrder[i], keyOrder[j]] = [keyOrder[j], keyOrder[i]]; }
    render();
    setTimeout(() => { if (Date.now() >= shuffleUntil) render(); }, 30050);
    floatUp("🔀 ¡Te desordenaron las letras 30 segundos!", from);
  }
}
// durante la sacudida, 4 de cada 10 toques caen en la tecla de al lado
function press(L){
  if (Date.now() < quakeUntil && S && Math.random() < 0.4){
    const order = [...$("keys").children].map(b => b.textContent);
    const i = order.indexOf(L);
    const near = [order[i - 1], order[i + 1]].filter(x => x && !S.used.includes(x));
    if (near.length) L = near[Math.floor(Math.random() * near.length)];
  }
  act({ t: "guess", l: L });
}
/* ---------- muñequitos ---------- */
const SKINS = {
  clasico: { label: "Clásico", icon: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 36H23M11 36V5H27V9"/><circle cx="27" cy="13" r="4"/><path d="M27 17V26M27 20l-4 4M27 20l4 4M27 26l-3 5M27 26l3 5"/></svg>' },
  nieve: { label: "Muñeco de nieve", icon: '<svg viewBox="0 0 40 40"><circle cx="20" cy="29" r="8.5" fill="#eef4fa"/><circle cx="20" cy="17.5" r="6.2" fill="#eef4fa"/><rect x="15" y="5" width="10" height="7" rx="1.5" fill="#2b2d42"/><rect x="12.5" y="11" width="15" height="2.4" rx="1.2" fill="#2b2d42"/><circle cx="17.8" cy="16.6" r="1" fill="#22223b"/><circle cx="22.2" cy="16.6" r="1" fill="#22223b"/><path d="M20 18.4l5 1-5 1z" fill="#f28c38"/><path d="M20 23.6l-3.4-2v4zM20 23.6l3.4-2v4z" fill="#e05263"/></svg>' },
};
function skinPicker(box){
  box.innerHTML = "";
  for (const [k, sk] of Object.entries(SKINS)){
    const b = document.createElement("button");
    b.type = "button"; b.className = "skin" + ((S.skin || "clasico") === k ? " sel" : "");
    b.innerHTML = sk.icon; b.append(sk.label);
    b.onclick = () => { store("ahorcado-skin", k); act({ t: "skin", k }); };
    box.append(b);
  }
}
// rayos del sol
(() => {
  let d = "";
  for (let k = 0; k < 12; k++){ const a = k * Math.PI / 6; d += `M${(160 + Math.cos(a) * 21).toFixed(1)} ${(48 + Math.sin(a) * 21).toFixed(1)}L${(160 + Math.cos(a) * 30).toFixed(1)} ${(48 + Math.sin(a) * 30).toFixed(1)}`; }
  $("snow").querySelector(".rays").setAttribute("d", d);
})();
// p = fallos / intentos (0..1), así se reparte igual con 1 o con 10 intentos
const SNOW_ACC = [["hat", .12], ["armL", .2], ["armR", .3], ["btn1", .4], ["btn2", .5], ["btn3", .58], ["bow", .68], ["nose", .8], ["eyes", .9]];
function drawSnow(p, dead){
  const sv = $("snow"), q = s => sv.querySelector(s), cl = x => Math.max(0, Math.min(1, x));
  q(".sky-d").style.opacity = cl(p * 2.2);
  q(".sky-h").style.opacity = cl((p - .5) * 2.2);
  q(".stars").style.opacity = cl(1 - p * 3);
  q(".moon").style.transform = `translateY(${cl(p * 2.5) * 190}px)`;
  q(".sun").style.transform = `translateY(${(1 - cl(p / .7)) * 170}px)`;
  q(".core").style.transform = `scale(${1 + cl((p - .6) / .4) * .6})`;
  q(".rays").style.opacity = cl((p - .45) * 3);
  q(".glow").style.opacity = cl(p * 1.4);
  q(".wet").style.opacity = cl((p - .45) * 1.8) * .85;
  q(".puddle").style.transform = `scale(${dead ? 1.45 : p * 1.25})`;
  sv.querySelectorAll(".slush").forEach(s => s.style.opacity = p * .5);
  // se adelgaza y se descuelga: al final queda flaquísimo
  const thin = dead ? .09 : 1 - .8 * p, thinH = dead ? .28 : 1 - .55 * p;
  q(".b3").style.transform = `scale(${thin},${1 + .16 * p})`;
  q(".b2").style.transform = `scale(${Math.min(1, thin * 1.08)},${1 + .07 * p})`;
  q(".b1").style.transform = `scale(${thinH},${1 + .04 * p})`;
  sv.dataset.mood = p < .25 ? 0 : p < .5 ? 1 : p < .75 ? 2 : 3;
  q(".sweat").style.opacity = p >= .3 ? 1 : 0;
  q(".tear").style.opacity = p >= .6 ? 1 : 0;
  const drips = Math.ceil(p * 4);
  sv.querySelectorAll(".drip").forEach((d, k) => d.classList.toggle("on", !dead && k < drips));
  // se le caen las cosas, una detrás de otra
  let order = 0;
  for (const [id, t] of SNOW_ACC){
    const el = q(".acc-" + id), f = p >= t, was = el.classList.contains("fell");
    el.style.transitionDelay = f && !was ? (order++ * .35) + "s" : "0s";
    el.classList.toggle("fell", f);
  }
  if (dead && !sv.classList.contains("dead")) sv.style.setProperty("--d", (order * .35 + .6) + "s");
  sv.classList.toggle("dead", dead);
}

$("react").addEventListener("submit", e => { e.preventDefault(); react($("inSay").value); $("inSay").value = ""; });
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("confetti"), cols = ["#a8e6cf", "#ffcfb0", "#a7c7e7", "#f3e3a0", "#ff9aa2"];
  for (let k = 0; k < 40; k++){
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = cols[k % cols.length];
    p.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    p.style.animationDelay = Math.random() * 0.4 + "s";
    box.append(p);
  }
  setTimeout(() => box.innerHTML = "", 4000);
}
// mensaje de espera con puntitos animados
function waitText(msg){
  $("waitMsg").textContent = msg;
  const d = document.createElement("span"); d.className = "dots"; d.innerHTML = "<i></i><i></i><i></i>";
  $("waitMsg").append(d);
}

const deathText = () => (S.roundSkin === "nieve" ? "¡Se derritió el muñeco de nieve!" : "¡Se murió el muñequito!");
function renderBoard(){
  const used = new Set(S.used), over = S.phase === "done", meGuess = mySeat === S.guesser && !over;
  const max = S.max || 6, lost = S.errors >= max;
  // qué letra es nueva desde lo último que se pintó (solo dentro de la misma ronda)
  const sameRound = seen.word === S.word && seen.g === S.setter;
  const newL = sameRound ? S.used.filter(L => !seen.used.includes(L)) : [];
  const last = newL[newL.length - 1];
  const fresh = { last, miss: !!last && ![...S.word].some(c => norm(c) === last), won: sameRound && over && !lost && !seen.over };
  seen = { word: S.word, g: S.setter, used: [...S.used], over };
  $("word").innerHTML = "";
  for (const c of S.word){
    const i = document.createElement("i");
    if (c === " ") i.className = "sp";
    else if (shown(c)){ i.textContent = c; i.className = "sp"; }
    else if (used.has(norm(c))){ i.textContent = c.toUpperCase(); if (newL.includes(norm(c))) i.className = "pop"; }
    else if (over || mySeat === S.setter){ i.textContent = c.toUpperCase(); i.className = "miss"; } // quien la puso la ve en rojo
    $("word").append(i);
  }
  // como en papel: empieza en blanco y cada fallo dibuja los siguientes trazos (suelo, palo, viga, cuerda, cabeza…);
  // con menos de 10 intentos cada fallo dibuja varios trazos seguidos
  const shownN = Math.round(S.errors * PARTS / max);
  let order = 0;
  document.querySelectorAll(".part").forEach((p, k) => {
    const on = k < shownN, was = p.classList.contains("show");
    p.style.transitionDelay = on && !was ? (order++ * 0.6) + "s" : "0s";
    p.classList.toggle("show", on);
  });
  const skin = S.roundSkin || "clasico";
  $("fig").toggleAttribute("hidden", skin !== "clasico"); $("snow").toggleAttribute("hidden", skin !== "nieve"); // en SVG .hidden no existe
  if (skin === "nieve") drawSnow(Math.min(1, S.errors / max), lost);
  const fig = $("fig");
  if (lost && !fig.classList.contains("dead")) fig.style.setProperty("--d", (order * 0.6 + 0.5) + "s"); // muere al acabar el último trazo
  fig.classList.toggle("dead", lost);
  $("lives").textContent = over ? `La puso ${mySeat === S.setter ? "tú" : nameOf(S.setter)}` : `Turno de ${mySeat === S.guesser ? "ti" : nameOf(S.guesser)}`;
  // contador: letras elegidas en total y fallos
  $("counter").innerHTML = "<span>Letras dichas: <b></b></span><span class=\"bad\">Fallos: <b></b></span>";
  const cb = $("counter").querySelectorAll("b");
  cb[0].textContent = S.used.length; cb[1].textContent = `${S.errors} de ${max}`;
  // vidas como corazones: se rompe uno con cada fallo
  $("hearts").innerHTML = "";
  for (let k = 0; k < max; k++){
    const h = document.createElement("i"); h.textContent = "♥";
    const gone = k >= max - S.errors;
    if (gone) h.className = "lost" + (fresh.miss && k === max - S.errors ? " break" : "");
    $("hearts").append(h);
  }
  // lo que acaba de pasar, en grande, para los dos (sobre todo para quien mira)
  if (fresh.last){
    const t = $("toast"), hit = !fresh.miss;
    const who = S.lastBy === mySeat ? "Tú" : nameOf(S.lastBy ?? S.guesser);
    t.className = "toast" + (hit ? "" : " no");
    t.innerHTML = "<b></b><span></span>";
    t.querySelector("b").textContent = fresh.last;
    t.querySelector("span").textContent = `${who}: ${hit ? "¡bien!" : "¡uy, no!"}`;
    t.hidden = false; t.style.animation = "none"; void t.offsetHeight; t.style.animation = "";
    clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1700);
    if (!hit){ const w = $("word"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); }
  }
  if (fresh.won) confetti();
  $("hint").textContent = "";
  if (S.hint){ const s = document.createElement("strong"); s.textContent = S.hint; $("hint").append("Pista: ", s); }

  $("keys").innerHTML = ""; $("keys").classList.toggle("wait", !meGuess); $("keys").hidden = over;
  for (const L of (Date.now() < shuffleUntil ? keyOrder : LETTERS)){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = L;
    if (used.has(L)) b.className = ([...S.word].some(c => norm(c) === L) ? "ok" : "no") + (L === last ? " just" : "");
    b.disabled = !meGuess || used.has(L);
    b.onclick = () => press(L);
    $("keys").append(b);
  }
  const gs = guessers(S), many = gs.length > 1;
  $("result").textContent = over
    ? (lost
        ? (mySeat === S.setter ? `${deathText()} +1 para ti` : `${deathText()} +1 para ${nameOf(S.setter)}`)
        : (mySeat === S.setter ? `¡${listNames(gs)} la ${many ? "adivinaron" : "adivinó"}! +1${many ? " cada uno" : ""}` : (many ? "¡La adivinaron! +1 para cada uno" : "¡La adivinaste! +1")))
    : (meGuess ? "" : `${nameOf(S.guesser)} está adivinando…`);
  $("nextBox").hidden = !over;
  powersTick();
  if (over){ skinPicker($("skinsB")); picks($("pickB")); }
}

$("vName").addEventListener("submit", e => {
  e.preventDefault();
  const n = $("inName").value.trim();
  if (!n) return $("nameErr").textContent = "Escribe tu nombre.";
  $("nameErr").textContent = "";
  myName = n.slice(0, 16); store("ahorcado-nombre", myName);
  if (!sala){
    sala = "ahorcado-" + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
    history.replaceState(null, "", "?sala=" + sala);
    mySeat = 0;
    S = FRESH(); S.names[0] = myName; S.v = 1;
    store("ahorcado-estado-" + sala, S); send(S);
    store("ahorcado-puesto-" + sala, mySeat);
  } else mySeat = -1; // el puesto (2.º o 3.º) se decide al cargar la partida
  render(); connect();
});

$("vSecret").addEventListener("submit", e => {
  e.preventDefault();
  const w = $("inWord").value.trim().replace(/\s+/g, " ");
  if (![...w].some(isLetter)) return $("secretErr").textContent = "Escribe al menos una letra.";
  if (!validWord(w)) return $("secretErr").textContent = "Máximo 40 caracteres y sin < ni >.";
  const hint = $("inHint").value.trim(), max = $("inMax").value;
  $("secretErr").textContent = ""; $("inWord").value = ""; $("inHint").value = ""; document.querySelector(".extra").open = false;
  act({ t: "secret", word: w, hint, max });
});
// cualquiera elige: con 2, "Adivina X" (el otro pone la palabra); con 3, "Pone la palabra X" (los otros dos adivinan)
function picks(box){
  box.innerHTML = "";
  const ps = players(S);
  box.style.gridTemplateColumns = `repeat(${ps.length},1fr)`;
  for (const i of ps){
    const b = document.createElement("button"), me = i === mySeat ? "yo" : nameOf(i);
    b.type = "button";
    if (ps.length === 2){ b.textContent = "Adivina " + me; b.onclick = () => act({ t: "next", w: ps.find(x => x !== i) }); }
    else { b.textContent = "Pone la palabra: " + me; b.onclick = () => act({ t: "next", w: i }); }
    box.append(b);
  }
}
$("invite3").onclick = async () => {
  const url = location.origin + location.pathname + "?sala=" + sala;
  try { if (navigator.share) await navigator.share({ text: "¿Te unes al ahorcado?", url }); else { await navigator.clipboard.writeText(url); $("invite3").textContent = "¡Enlace copiado!"; setTimeout(() => $("invite3").textContent = "＋ Invitar a una tercera persona (opcional)", 2000); } }
  catch {}
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("link").value); $("copy").textContent = "¡Copiado!"; }
  catch { $("link").select(); $("copy").textContent = "Cópialo a mano"; }
  setTimeout(() => $("copy").textContent = "Copiar enlace", 2000);
};

document.addEventListener("keydown", e => {
  if ($("vPlay").hidden || e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase();
  if (LETTERS.includes(k)) press(k);
});

// arranque: si este móvil ya estaba en la partida, entra directo
myName = load("ahorcado-nombre") || "";
$("inName").value = myName;
if (sala){
  $("nameTitle").textContent = "Te han invitado a jugar"; $("nameBtn").textContent = "Entrar a jugar";
  const seat = load("ahorcado-puesto-" + sala);
  if ([0, 1, 2].includes(seat) && myName){ mySeat = seat; connect(); }
}
render();
